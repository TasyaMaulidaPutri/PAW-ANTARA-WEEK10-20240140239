<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Toko Kita — Chat with AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #EFEAE3;
    --card: #FFFFFF;
    --ink: #241F2E;
    --ink-soft: #6b6577;
    --line: #ECE7F0;
    --accent: #6B4570;
    --accent-dark: #4E3452;
    --bot-bubble: #F4EEF4;
    --online: #3FAE7A;
    --radius-lg: 22px;
    --radius-md: 14px;
    --shadow: 0 24px 60px -20px rgba(36, 31, 46, 0.35);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    background-image: radial-gradient(circle at 15% 10%, rgba(107,69,112,0.08), transparent 45%),
                       radial-gradient(circle at 85% 90%, rgba(107,69,112,0.06), transparent 45%);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 16px;
  }

  .widget {
    width: 100%;
    max-width: 400px;
    height: 640px;
    background: var(--card);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- header ---------- */
  header {
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    padding: 20px 22px 18px;
    color: #fff;
    flex-shrink: 0;
  }

  .brand-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: rgba(255,255,255,0.18);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Sora', sans-serif;
    font-weight: 700;
    font-size: 15px;
    flex-shrink: 0;
  }

  .brand-text .name {
    font-family: 'Sora', sans-serif;
    font-weight: 600;
    font-size: 16px;
    line-height: 1.2;
  }

  .brand-text .status {
    font-size: 11.5px;
    opacity: 0.85;
    display: flex;
    align-items: center;
    gap: 5px;
    margin-top: 2px;
  }

  .status .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--online);
    display: inline-block;
  }

  .toolbar {
    margin-top: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .session-chip {
    flex: 1;
    background: rgba(255,255,255,0.14);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 11px;
    font-family: 'Inter', sans-serif;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .session-chip .label { opacity: 0.7; margin-right: 4px; }

  .icon-btn {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: rgba(255,255,255,0.14);
    border: none;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s ease;
  }
  .icon-btn:hover { background: rgba(255,255,255,0.26); }
  .icon-btn svg { width: 15px; height: 15px; }

  /* ---------- messages ---------- */
  .log {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 20px 18px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    background: var(--card);
  }

  .log::-webkit-scrollbar { width: 5px; }
  .log::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--ink-soft);
    font-size: 13px;
    line-height: 1.6;
    max-width: 240px;
  }
  .empty-state .big-emoji { font-size: 26px; margin-bottom: 8px; display: block; }

  .msg-group {
    max-width: 78%;
    margin: 6px 0;
  }
  .msg-group.user { margin-left: auto; text-align: right; }
  .msg-group.bot { margin-right: auto; text-align: left; }

  .bubble {
    padding: 10px 14px;
    font-size: 13.5px;
    line-height: 1.5;
    border-radius: var(--radius-md);
    display: inline-block;
    text-align: left;
    max-width: 100%;
  }

  .msg-group.user .bubble {
    background: var(--ink);
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  .msg-group.bot .bubble {
    background: var(--bot-bubble);
    color: var(--ink);
    border-bottom-left-radius: 4px;
  }

  .msg-time {
    font-size: 10px;
    color: var(--ink-soft);
    margin-top: 4px;
    padding: 0 3px;
  }

  .system-note {
    align-self: center;
    font-size: 11px;
    color: var(--ink-soft);
    background: var(--line);
    padding: 5px 12px;
    border-radius: 999px;
    margin: 8px 0;
  }

  /* ---------- footer ---------- */
  footer {
    flex-shrink: 0;
    border-top: 1px solid var(--line);
    padding: 12px 16px 16px;
    background: var(--card);
  }

  .consent {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 8px 10px;
    background: var(--bg);
    border-radius: 12px;
    margin-bottom: 10px;
    cursor: pointer;
    user-select: none;
  }

  .consent .switch {
    position: relative;
    width: 32px;
    height: 18px;
    flex-shrink: 0;
  }
  .consent .switch input { opacity: 0; width: 0; height: 0; }
  .consent .switch .track {
    position: absolute;
    inset: 0;
    background: #d8d2df;
    border-radius: 999px;
    transition: background 0.15s ease;
  }
  .consent .switch .track::before {
    content: "";
    position: absolute;
    width: 14px;
    height: 14px;
    left: 2px;
    top: 2px;
    background: #fff;
    border-radius: 50%;
    transition: transform 0.15s ease;
    box-shadow: 0 1px 2px rgba(0,0,0,0.25);
  }
  .consent .switch input:checked + .track { background: var(--accent); }
  .consent .switch input:checked + .track::before { transform: translateX(14px); }

  .consent .label {
    font-size: 11.5px;
    color: var(--ink-soft);
    line-height: 1.4;
  }
  .consent .label strong { color: var(--ink); font-weight: 600; }

  .input-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .input-row input[type="text"] {
    flex: 1;
    border: 1px solid var(--line);
    background: var(--bg);
    border-radius: 999px;
    padding: 11px 16px;
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    color: var(--ink);
    outline: none;
    min-width: 0;
  }
  .input-row input[type="text"]:focus { border-color: var(--accent); background: #fff; }
  .input-row input[type="text"]::placeholder { color: #a7a1b0; }

  .send-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .send-btn:hover { background: var(--accent-dark); }
  .send-btn:active { transform: scale(0.94); }
  .send-btn:disabled { opacity: 0.5; cursor: default; }
  .send-btn svg { width: 16px; height: 16px; }

  .page-hint {
    margin-top: 16px;
    text-align: center;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    color: #9b93a8;
  }
</style>
</head>
<body>

<div>
  <div class="widget">
    <header>
      <div class="brand-row">
        <div class="avatar">TK</div>
        <div class="brand-text">
          <div class="name">Toko Kita</div>
          <div class="status"><span class="dot"></span> CS Bot · Online</div>
        </div>
      </div>

      <div class="toolbar">
        <div class="session-chip"><span class="label">Sesi</span><span id="sessionValue">belum ada</span></div>
        <button class="icon-btn" id="loadHistoryBtn" title="Muat riwayat sesi ini">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        </button>
        <button class="icon-btn" id="newSessionBtn" title="Sesi baru">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
    </header>

    <div class="log" id="log">
      <div class="empty-state" id="emptyState">
        <span class="big-emoji">💬</span>
        Belum ada percakapan.<br />Tanya soal produk di toko ini buat mulai ngobrol sama bot.
      </div>
    </div>

    <footer>
      <label class="consent">
        <span class="switch">
          <input type="checkbox" id="saveHistory" />
          <span class="track"></span>
        </span>
        <span class="label"><strong>Simpan riwayat percakapan</strong><br />Diaktifkan hanya kalau kamu setuju</span>
      </label>

      <div class="input-row">
        <input type="text" id="messageInput" placeholder="Tulis pertanyaan kamu..." autocomplete="off" />
        <button class="send-btn" id="sendBtn" title="Kirim">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
        </button>
      </div>
    </footer>
  </div>

  <div class="page-hint">terhubung ke POST /api/chat &amp; GET /api/chat/history/:sessionId</div>
</div>

<script>
  const API_BASE = window.location.origin;

  const log = document.getElementById('log');
  const emptyState = document.getElementById('emptyState');
  const sessionValue = document.getElementById('sessionValue');
  const saveHistoryCheckbox = document.getElementById('saveHistory');
  const messageInput = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');
  const loadHistoryBtn = document.getElementById('loadHistoryBtn');
  const newSessionBtn = document.getElementById('newSessionBtn');

  let sessionId = null;

  function formatTime(date) {
    return date.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
  }

  function updateSessionDisplay() {
    sessionValue.textContent = sessionId ? sessionId.slice(0, 8) + '…' : 'belum ada';
  }

  function clearEmptyState() {
    if (emptyState.parentNode) emptyState.remove();
  }

  function addLine(role, content) {
    clearEmptyState();

    if (role === 'system') {
      const note = document.createElement('div');
      note.className = 'system-note';
      note.textContent = content;
      log.appendChild(note);
      log.scrollTop = log.scrollHeight;
      return;
    }

    const group = document.createElement('div');
    group.className = 'msg-group ' + role;

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = content;

    const time = document.createElement('div');
    time.className = 'msg-time';
    time.textContent = formatTime(new Date());

    group.appendChild(bubble);
    group.appendChild(time);
    log.appendChild(group);
    log.scrollTop = log.scrollHeight;
  }

  function resetLog() {
    log.innerHTML = '';
    log.appendChild(emptyState);
  }

  async function sendMessage() {
    const message = messageInput.value.trim();
    if (!message) return;

    sendBtn.disabled = true;
    addLine('user', message);
    messageInput.value = '';

    try {
      const res = await fetch(API_BASE + '/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message,
          sessionId,
          saveHistory: saveHistoryCheckbox.checked,
        }),
      });
      const json = await res.json();

      if (!json.success) {
        addLine('system', 'Gagal: ' + json.message);
        return;
      }

      addLine('bot', json.data.reply);

      if (json.data.sessionId) {
        sessionId = json.data.sessionId;
      }
      updateSessionDisplay();
    } catch (err) {
      addLine('system', 'Gagal menghubungi server: ' + err.message);
    } finally {
      sendBtn.disabled = false;
      messageInput.focus();
    }
  }

  async function loadHistory() {
    if (!sessionId) {
      addLine('system', 'Belum ada sesi. Kirim pesan dengan "Simpan riwayat" aktif dulu.');
      return;
    }

    try {
      const res = await fetch(API_BASE + '/api/chat/history/' + sessionId);
      const json = await res.json();

      if (!json.success) {
        addLine('system', 'Gagal ambil riwayat: ' + json.message);
        return;
      }

      resetLog();
      if (!json.data.length) {
        addLine('system', 'Riwayat kosong untuk sesi ini.');
        return;
      }

      json.data.forEach((m) => addLine(m.role, m.content));
      addLine('system', 'Riwayat dimuat ulang dari server');
    } catch (err) {
      addLine('system', 'Gagal menghubungi server: ' + err.message);
    }
  }

  function startNewSession() {
    sessionId = null;
    resetLog();
    updateSessionDisplay();
    addLine('system', 'Sesi baru dimulai');
  }

  sendBtn.addEventListener('click', sendMessage);
  messageInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage();
  });
  loadHistoryBtn.addEventListener('click', loadHistory);
  newSessionBtn.addEventListener('click', startNewSession);

  updateSessionDisplay();
</script>

</body>
</html>
